events {}

http {
    # cloudflared (host) -> frontdoor (172.20/16) -> this gate, all inside the
    # docker 172.16.0.0/12 range. Trust that chain so the real client IP comes
    # from Cloudflare's CF-Connecting-IP header, not the frontdoor hop.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;

    server {
        listen 8000;
        client_max_body_size 200m;   # large plan PDFs

        # Office WiFi public IP (via the tunnel) + office LAN /24s (servers +
        # Alex's clients). Everything else denied.
        allow 180.150.112.71/32;
        allow 192.168.0.0/24;
        allow 192.168.10.0/24;
        deny all;

        # Proxy to the app's own frontend nginx (serves the SPA and proxies
        # /api/ to the backend). Same compose network, resolved by service name.
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # SSE search-progress stream must not be buffered.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
